<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="页面描述">
    <meta name="keywords" content="关键词1, 关键词2">
    <meta name="author" content="作者">
    <title>image</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;  /* 让 padding 不撑大元素 */
    }
    .main_div {
        width: 100vw;
        height: 100vh;
    }
    .flex_column_center {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction:column
    }
    .flex_row_center {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction:row
    }
    .flex_column {
        display: flex;
        flex-direction:column
    }
    .flex_row {
         display: flex;
         flex-direction:row
    }
    .img_canvas {
        width: 500px;
        height: 500px;
        background-color: black;
    }
    .style_button {
        width: 70px;
        height: 30px;
        border: none;
        background-color: #0075FF;
        color: white;
        border-radius: 5px;
    }
    .style_button:hover {
        cursor: pointer;
        background-color: #00b3ff;
    }
    .style_slider {

    }
    .style_slider:hover:hover {
        cursor: pointer;
    }
    .label_fixed {
    width: 3em;
    text-align: right;
    flex-shrink: 0;  /* 不缩小 */    
    }
    .label_fixed_left {
    width: 3em;
    text-align: left;
    flex-shrink: 0;  /* 不缩小 */    
    }
    .no_select {
    user-select: none;           /* 标准属性 */
    -webkit-user-select: none;   /* Safari */
    -moz-user-select: none;      /* Firefox */
    -ms-user-select: none;       /* IE/Edge */
}
</style>
<body>

    <div class="main_div flex_column_center no_select" style="gap:1rem">
        <div>
            <button id="uploadBtn" class="style_button">导入图片</button>
            <input type="file" accept="image/*" id="fileInput" style="display: none;">
        </div>
        <div class="flex_row" style="gap:1rem">
            <canvas id="canvasRoot" class="img_canvas" width="500" height="500">  
            </canvas>
            <canvas id="canvasChange" class="img_canvas" width="500" height="500">
            </canvas>
            <div class="flex_column_center">
                <div class="flex_row" style="gap:0.5rem">
                    <label class="label_fixed">对比度</label>
                    <input class="style_slider" type="range" min="-5" max="5" value="1" step="0.001"  id="sliderContrast">
                    <label class="label_fixed_left" id="labelContrast">1</label>
                </div>
                <div class="flex_row" style="gap:0.5rem">
                    <label class="label_fixed">亮度</label>
                    <input class="style_slider" type="range" min="-100" max="100" value="0" step="0.001"  id="sliderBrightness">
                    <label class="label_fixed_left" id="labelBrightness">1</label>
                </div>  
            </div>
        </div>
    </div>
    <script src="src/ui.js"></script>
    <script src="src/store.js"></script>
    <script src="src/util.js"></script>
    <script src="src/algorithm.js"></script>
    <script src="src/image.js"></script>
</body>
</html>
